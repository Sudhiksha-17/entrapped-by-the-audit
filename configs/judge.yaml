# Cost estimate inputs (planning only; OpenRouter-reported cost is recorded per call).
price_in_per_m: 0.40        # openai/gpt-4.1-mini, OpenRouter list price fetched 2026-10-17T07:16Z
price_out_per_m: 1.60
chars_per_token: 4.0        # rough English average; replaced by measured values after the first real judge run
expected_output_tokens: 150
margin: 1.25
