# Stage 2 judge settings (prereg/stage2_message_and_judge.md section 3: gpt-4.1-mini, temperature 0, JSON mode on).
model: {provider: openrouter, model: openai/gpt-4.1-mini, openrouter_provider: openai, json_mode: true}
temperature: 0.0
max_tokens: 4000            # not set by the spec; upstream default (DECISIONS D-065)
retry: {max_attempts: 5, base_delay_s: 1.0, max_delay_s: 30.0}
