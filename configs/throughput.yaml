# Phase 2 throughput test (CLAUDE.md credit rule 5): 2 parallel episodes of 5 rounds, same agents and route as configs/smoke.yaml.
# Route: OpenRouter, openai/gpt-4o-mini, pinned to backend "openai" with fallbacks disabled (human message 7).
stage: throughput
run_type: exploratory      # exploratory | pilot | confirmatory (confirmatory refuses uncommitted changes)
run_name: throughput
replicates: 2
concurrency: 2
rounds: 5
temperature: 0.7          # upstream default (cda_types.py:29)
max_tokens: 4000          # upstream default (model_wrappers.py:27)
seller_comms_enabled: true
max_message_length: 500   # upstream default (cda_types.py:38)
seller_valuations: [80.0, 80.0, 80.0]
buyer_valuations: [100.0, 100.0, 100.0]
initial_book: {seller_ask_center: 97.5, seller_ask_spread: 2.5, buyer_bid_center: 82.5, buyer_bid_spread: 2.5}

# json_mode: true matches upstream, which uses JSON mode for gpt models (misc.py:13). Held item H-2.
model: &model {provider: openrouter, model: openai/gpt-4o-mini, openrouter_provider: openai, json_mode: true}
sellers: [*model, *model, *model]
buyers: [*model, *model, *model]

retry: {max_attempts: 5, base_delay_s: 1.0, max_delay_s: 30.0}
# Guard against runaway calls: 90 agent calls expected for 15 rounds x 6 agents.
max_api_attempts_per_episode: 80
# Episode fails with reason "parse_cap" when this many responses are unparseable (human message 7). Held item H-1.
max_parse_failures_per_episode: 10

# Estimate from the measured smoke episode (20261016T214450Z_smoke_e58fd8): $0.0375 for 15 rounds.
# 5 rounds scaled linearly is $0.0125; rounded up to $0.015 per episode.
estimated_cost_per_episode_usd: 0.015
