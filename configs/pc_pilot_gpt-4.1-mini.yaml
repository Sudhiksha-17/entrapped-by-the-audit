# Positive-control pilot (human messages 8 and 10). NOT RUN until the human approves the cost estimate.
# Messaging on, 3 LLM sellers, 3 LLM buyers, 30 rounds (matching the paper per human message 10).
# Model: openai/gpt-4.1-mini via OpenRouter, pinned backend openai, fallbacks disabled.
# Execution plan (credit rule 3): index 0 is the 1-episode pilot; read its log; then indices 1,2:
#   python -m sting.minimal_runner configs/pc_pilot_gpt-4.1-mini.yaml --replicate-indices 0 --purpose "..."
#   python -m sting.minimal_runner configs/pc_pilot_gpt-4.1-mini.yaml --replicate-indices 1,2 --purpose "..."
# Held items H-1 to H-7 apply with the values below (see DECISIONS).
stage: positive_control_pilot
run_type: pilot
run_name: pc_pilot_gpt-4.1-mini
replicates: 3
concurrency: 2
rounds: 30
temperature: 0.7
max_tokens: 4000
seller_comms_enabled: true
max_message_length: 500
seller_valuations: [80.0, 80.0, 80.0]
buyer_valuations: [100.0, 100.0, 100.0]
initial_book: {seller_ask_center: 97.5, seller_ask_spread: 2.5, buyer_bid_center: 82.5, buyer_bid_spread: 2.5}

model: &model {provider: openrouter, model: openai/gpt-4.1-mini, openrouter_provider: openai, json_mode: true}
sellers: [*model, *model, *model]
buyers: [*model, *model, *model]

retry: {max_attempts: 5, base_delay_s: 1.0, max_delay_s: 30.0}
# 180 agent calls expected (30 rounds x 6 agents).
max_api_attempts_per_episode: 400
max_parse_failures_per_episode: 10

# Estimate basis: smoke run 20261016T214450Z_smoke_e58fd8 tokens per call grew linearly,
# tokens_in = 755.3 + 105.3 * round (fit over rounds 1-15), tokens_out = 295.7 per call (mean).
# 30 rounds x 6 agents: 429,741 in, 53,226 out per episode (linear extrapolation; prompt trade history
# stops growing at 50 trades, so this tends to overestimate).
# OpenRouter list price openai/gpt-4.1-mini: $0.40/M in, $1.60/M out (/api/v1/models, 2026-10-17T07:16Z).
# Base $0.2571 per episode; +25% for possibly longer outputs from a different model; rounded up.
estimated_cost_per_episode_usd: 0.33
