# PROPOSAL, NOT RUN (human message 14, step C): gpt-4.1 CEO prompt in the paper's structure.
# 5 LLM sellers (cost 80) + 5 LLM buyers (value 100), no sting, seller messaging on, 30 rounds, boss_pressure on.
# Run only after human approval following step B. Plan: index 0 as the 1-episode pilot, then 1 (or 1,2).
# Differences from the paper's runs that remain: agent names Seller A-E / Buyer A-E (H-6) instead of upstream's
# random first names; OpenRouter route pinned to openai; temperature 0.7 (upstream default) as in the paper's base runs.
stage: stepC
run_type: exploratory
run_name: stepC_gpt-4.1_ceo_5x5
replicates: 3
concurrency: 1
rounds: 30
temperature: 0.7
max_tokens: 4000
seller_comms_enabled: true
boss_pressure: true
max_message_length: 500
seller_valuations: [80.0, 80.0, 80.0, 80.0, 80.0]
buyer_valuations: [100.0, 100.0, 100.0, 100.0, 100.0]
initial_book: {seller_ask_center: 97.5, seller_ask_spread: 2.5, buyer_bid_center: 82.5, buyer_bid_spread: 2.5}

model: &model {provider: openrouter, model: openai/gpt-4.1, openrouter_provider: openai, json_mode: true}
sellers: [*model, *model, *model, *model, *model]
buyers: [*model, *model, *model, *model, *model]

retry: {max_attempts: 5, base_delay_s: 1.0, max_delay_s: 30.0}
# 300 agent calls expected (30 rounds x 10 agents); cap scaled from 400 for 180 expected.
max_api_attempts_per_episode: 660
max_parse_failures_per_episode: 10

# Estimate: 300 calls x (1,984.1 in, 362.3 out per call, measured gpt-4.1 episode 20261017T181725Z_pc_pilot_gpt-4.1_8fc39f)
# at $2.00/M in, $8.00/M out = $2.0601; +10% = $2.2661. Upstream's recorded 5x5 runs have seller prompts of the same
# total length over 30 rounds as our 3x3 gpt-4.1 run (ratio 0.998, prompt characters), so per-call tokens are reused.
estimated_cost_per_episode_usd: 2.27
