# Offline configuration used by tests (fake client, no network).
stage: test
run_type: exploratory      # exploratory | pilot | confirmatory (confirmatory refuses uncommitted changes)
run_name: fake
replicates: 2
concurrency: 2
rounds: 3
temperature: 0.7
max_tokens: 4000
seller_comms_enabled: true
max_message_length: 500
seller_valuations: [80.0, 80.0, 80.0]
buyer_valuations: [100.0, 100.0, 100.0]
model: &model {provider: fake, model: fake-model}
sellers: [*model, *model, *model]
buyers: [*model, *model, *model]
max_api_attempts_per_episode: 100
max_parse_failures_per_episode: 3
estimated_cost_per_episode_usd: 0.0
